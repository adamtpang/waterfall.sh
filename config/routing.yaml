schema_version: 1
classifier_model: deepseek-v4-flash
promotion_cap: 2
efforts:
  - low
  - medium
  - high
  - xhigh
  - max

models:
  deepseek-v4-flash:
    display_name: DeepSeek V4 Flash
    provider_id: deepseek/deepseek-v4-flash
  deepseek-v4-pro:
    display_name: DeepSeek V4 Pro
    provider_id: deepseek/deepseek-v4-pro
    default_tier: implement
  gemini-flash:
    display_name: Gemini 3.x Flash
    provider_id: google/gemini-3-flash
    default_tier: draft
  gemini-flash-lite:
    display_name: Gemini 3.x Flash-Lite
    provider_id: google/gemini-3-flash-lite
  glm-5.3-flash:
    display_name: GLM-5.3-Flash
    provider_id: z-ai/glm-5.3-flash
  minimax-m3:
    display_name: MiniMax M3
    provider_id: minimax/minimax-m3
  grok-4.6:
    display_name: Grok 4.6
    provider_id: x-ai/grok-4.6
  glm-5.3:
    display_name: GLM-5.3
    provider_id: z-ai/glm-5.3
  kimi-k3:
    display_name: Kimi K3
    provider_id: moonshotai/kimi-k3
  claude-opus-5:
    display_name: Claude Opus 5
    provider_id: anthropic/claude-opus-5
  claude-sonnet-5:
    display_name: Claude Sonnet 5
    provider_id: anthropic/claude-sonnet-5
  gpt-5.6-terra:
    display_name: GPT-5.6 Terra
    provider_id: openai/gpt-5.6-terra
  gpt-5.6-sol:
    display_name: GPT-5.6 Sol
    provider_id: openai/gpt-5.6-sol
  claude-fable-5.1:
    display_name: Claude Fable 5.1
    provider_id: anthropic/claude-fable-5-1
    adaptive_thinking: true
    cache_read_price: 0.25

aliases:
  opus-5: claude-opus-5
  sonnet-5: claude-sonnet-5
  fable-5.1: claude-fable-5.1
  claude-fable-5-1: claude-fable-5.1
  gemini-3-flash: gemini-flash
  gemini-3-flash-lite: gemini-flash-lite
  Gemini 3.x Flash: gemini-flash
  Gemini 3.x Flash-Lite: gemini-flash-lite

classification:
  frontend:
    - frontend
    - ui
    - ux
    - css
    - component
    - responsive
    - accessibility
    - react
    - vue
    - svelte
  rare_bug:
    - flaky
    - intermittent
    - race condition
    - deadlock
    - heisenbug
    - rare crash
    - segmentation fault
  cant_be_wrong:
    - can't be wrong
    - cant be wrong
    - cannot be wrong
    - can't fail
    - cant fail
    - ceiling quality
  long_horizon:
    - finish the pr
    - finish this pr
    - long horizon
    - long-running
    - 30+ min
    - autonomous agent
    - entire repository
  repo_span:
    - multi-file
    - multiple files
    - across the repo
    - repository-wide
    - architecture
    - migration
    - end-to-end
  trivial:
    - commit message
    - lint fix
    - formatting
    - typo
    - rename
    - stub
    - add a test
    - one-file
    - one file
  high_failure_cost:
    - production
    - security
    - authentication
    - authorization
    - payment
    - billing
    - data loss
    - destructive
    - incident

tiers:
  - id: classify
    priority: 0
    models: [deepseek-v4-flash, gemini-flash-lite, glm-5.3-flash, minimax-m3]
    effort: low
    use_when: Tag hardness, language, repo span, and tool need.
  - id: draft
    priority: 1
    models: [deepseek-v4-flash, minimax-m3, glm-5.3-flash]
    effort: low
    allowed_efforts: [low, medium]
    reviewer_tier: implement
    use_when: One-file edits, tests, stubs, lint fixes, and commit messages.
  - id: implement
    priority: 2
    models: [grok-4.6, glm-5.3, kimi-k3]
    effort: medium
    reviewer_tier: harden
    use_when: Default implementation work with near-frontier value.
  - id: harden
    priority: 3
    models: [claude-opus-5, gpt-5.6-terra, gpt-5.6-sol]
    effort: high
    reviewer_models: [claude-sonnet-5]
    high_risk_reviewer_models: [claude-fable-5.1]
    use_when: Multi-file architecture, review, and quality-floor work.
  - id: escalate
    priority: 4
    models: [claude-fable-5.1]
    effort: high
    allowed_efforts: [high, xhigh]
    reviewer_models: [claude-opus-5]
    use_when: A harden attempt failed a blocking check, or the task is explicitly high risk.
  - id: ceiling
    priority: 5
    models: [claude-fable-5.1]
    effort: max
    reviewer_models: [claude-opus-5]
    use_when: Explicit ceiling request or two failed escalation attempts.

promotion:
  allowed:
    - tests_failed
    - reviewer_reject
    - author_stuck
    - author_refused
    - empty_patch
    - diff_empty
    - diff_reverts_repo
    - user_escalate
  denied:
    - verbosity
    - style_nit
    - could_be_more_elegant
    - missing_comments
    - author_requests_smarter_model
