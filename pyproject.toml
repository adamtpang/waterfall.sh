[project]
name = "waterfall-router"
version = "0.1.0"
description = "Cascade to the best model, automatically -- classify a prompt, route the routine part to the cheapest capable OpenRouter model, keep a ledger of what it saved."
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]

[project.scripts]
waterfall = "router.cli:main"
watertop = "desktop.watertop:main"
waterfall-tray = "desktop.quota_tray:main"

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
tray = ["pystray>=0.19", "Pillow>=10.0"]

[tool.setuptools]
packages = ["router", "router.classifier", "desktop"]

[tool.setuptools.package-data]
"router.classifier" = ["data/*.json"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
