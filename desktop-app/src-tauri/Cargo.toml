[package]
name = "waterfall"
version = "0.1.0"
description = "waterfall.sh native desktop — cascade + peer agent launcher"
authors = ["Adam"]
edition = "2021"

[lib]
name = "waterfall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP for the OpenRouter cascade. rustls (not native-tls) so the build
# needs no system OpenSSL; blocking client keeps the command bodies simple
# and they already run off the UI thread via Tauri's async runtime.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
