[package]
name = "waterfall"
version = "0.1.0"
description = "waterfall.sh native desktop — cascade + peer agent launcher"
authors = ["Adam"]
edition = "2021"

[lib]
name = "waterfall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
